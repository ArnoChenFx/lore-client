name: Release Desktop Client

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate Version and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag and project version
        run: bun run release:prepare --check "${{ github.ref_name }}"

      - name: Run frontend tests
        run: bun test

      - name: Build frontend
        run: bun run build

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rustTargets: ''
            tauriArgs: '--bundles nsis'
          - name: Linux x64
            platform: ubuntu-latest
            rustTargets: ''
            tauriArgs: '--bundles appimage,deb'
          - name: macOS Universal
            platform: macos-latest
            rustTargets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauriArgs: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate production release configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: bun run release:prepare "${{ github.ref_name }}"

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lore Client ${{ github.ref_name }}'
          releaseBody: |
            Release notes are generated after all platform artifacts have been uploaded.
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: '${{ matrix.tauriArgs }} --config src-tauri/tauri.release.conf.json'

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release history
        uses: actions/checkout@v4
        with:
          # 生成准确的版本区间提交记录需要完整历史与全部标签，浅克隆无法解析上一个版本。
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Generate release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          # 当前 Release 在此阶段仍是草稿，因此排除草稿后得到的第一项就是上一个已发布版本。
          previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"

          {
            echo "## Changes"
            echo
            if [ -n "$previous_tag" ]; then
              # 区间左开右闭：不重复上一版本的提交，同时包含当前标签指向的全部新提交。
              echo "Changes since [$previous_tag](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$previous_tag):"
              echo
              git log "$previous_tag..$CURRENT_TAG" \
                --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))"
            else
              # 首次发布没有可比较版本，退化为列出当前标签可达的完整提交历史。
              echo "Changes included in this first release:"
              echo
              git log "$CURRENT_TAG" \
                --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))"
            fi
            echo
            echo
            echo "Download the installer for your platform from the assets below. Existing installations can also check for and install updates from the client settings."
          } > release-notes.md

      - name: Verify updater manifest and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir updater-manifest
          test -s updater-manifest/latest.json
          # tauri-action 在构建阶段会把临时 releaseBody 同时写入 latest.json；发布前必须
          # 将最终正文同步回更新清单，否则客户端版本号正确但会显示草稿占位说明。
          node scripts/sync-updater-manifest-notes.mjs updater-manifest/latest.json release-notes.md "${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" updater-manifest/latest.json --clobber
          # 只有更新清单替换成功后才公开 Release，避免用户观察到正文与客户端说明不一致。
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md --draft=false
