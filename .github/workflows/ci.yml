name: Cross-Platform Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# CI 只需要读取源码；显式收窄 GITHUB_TOKEN 权限，避免依赖仓库默认权限设置。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-check:
    name: Validate ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
          - name: Linux
            platform: ubuntu-latest
          - name: macOS
            platform: macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend and script tests
        run: bun test

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check desktop backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 后端测试（约 195 个，含 lore_adapter 与资产预览解析）此前只在本地执行，CI 从未运行。
      # 目前只在 Linux 启用：这里已在 Linux 上全部通过；Windows 与 macOS 上的 #[cfg] 分支尚未验证。
      - name: Run desktop backend tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml
