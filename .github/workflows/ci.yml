name: Cross-Platform Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# CI 只需要读取源码；显式收窄 GITHUB_TOKEN 权限，避免依赖仓库默认权限设置。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-check:
    name: Validate ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
          - name: Linux
            platform: ubuntu-latest
          - name: macOS
            platform: macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend and script tests
        run: bun run test

      - name: Check frontend lint and formatting
        if: runner.os == 'Linux'
        run: |
          bun run lint
          bun run format:check

      - name: Build frontend
        run: bun run build

      - name: Run core browser workflows
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          LORE_CDP_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser-core
        run: |
          mkdir -p "$LORE_CDP_ARTIFACT_DIR"
          set -o pipefail
          bun run test:ui:core 2>&1 | tee "$LORE_CDP_ARTIFACT_DIR/run.log"

      - name: Upload browser workflow evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-core-${{ github.run_attempt }}
          path: artifacts/browser-core
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check desktop backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # 后端测试（约 195 个，含 lore_adapter 与资产预览解析）此前只在本地执行，CI 从未运行。
      # 目前只在 Linux 启用：这里已在 Linux 上全部通过；Windows 与 macOS 上的 #[cfg] 分支尚未验证。
      - name: Run desktop backend tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
