[package]
name = "lore-client"
version = "0.2.4"
description = "Lore desktop version control client"
authors = ["Lore Client Contributors"]
edition = "2021"

[lib]
name = "lore_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml_edit = "0.25.13"

[dependencies]
# 仅用于把浏览器无法直接显示的 TGA/TIFF 转成 PNG；不引入完整编解码全家桶。
image = { version = "0.25", default-features = false, features = ["dds", "exr", "jpeg", "png", "tga", "tiff"] }
# SVG 只在 Rust 边界解析并栅格化；关闭位图嵌入与内存映射字体功能，且由调用方
# 覆盖 href 解析器，避免预览读取本地路径、外部资源或把原始 SVG 交给 WebView。
resvg = { version = "0.47.0", default-features = false, features = ["text", "system-fonts"] }
# Diff 预览只解码单张受限尺寸纹理。EXR 默认的 Rayon 并行解码会把短命像素块
# 分散到全局工作线程的分配器缓存，在 Windows 上每次刷新都抬高数百 MiB Private Bytes。
exr = { version = "1.74", default-features = false }
zstd = "0.13"
# Blender 旧版压缩文件使用 gzip；关闭系统 zlib，保持桌面构建可复现且不引入额外动态库。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
glob-match = "0.2.1"
lore = { git = "https://github.com/EpicGames/lore.git", rev = "6fd18e6cf54b84c8715c3a7ac5922617a2399e02" }
# 认证变更需要调用 Lore 顶层 crate 尚未暴露的 Transport 连接失效入口；
# 依赖必须与 `lore` 锁定到完全相同的提交，避免协议实现漂移或重复版本。
lore-revision = { git = "https://github.com/EpicGames/lore.git", rev = "6fd18e6cf54b84c8715c3a7ac5922617a2399e02" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.10"
open = "5.4.0"
tempfile = "3"
toml_edit = "0.25.13"
tauri-plugin-log = "2.9.0"
log = "0.4"
# 归档预览只读取 ZIP 中央目录，正文不会解压或写入磁盘；关闭默认功能可避免
# 引入本功能不需要的加密与额外压缩算法。
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

# Lore 当前提交扩展了 quinn-proto 的 RTT 与加密错误接口。作为外部 Git
# 依赖时，上游工作区的 path patch 不会自动传播，因此在客户端侧携带同一份
# MIT/Apache-2.0 vendored crate，确保依赖图与固定 Lore 提交完全一致。
[patch.crates-io]
quinn-proto = { path = "vendor/quinn-proto" }

# Windows MSVC 的单个 PDB 有体积/类型数量上限。完整 debug=2 会让 Lore 及其
# 依赖链生成数 GB 级 PDB（例如 lore.dll.pdb），触发 link.exe LNK1140。
# line-tables-only 仍保留行号栈回溯，足够日常开发、panic 定位与测试失败排查。
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
