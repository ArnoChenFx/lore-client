<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 68 336 374">
  <defs>
    <!--
      透明版与完整应用图标共享相同颜色和轨道几何，仅移除系统图标底座。
      独立 viewBox 为前端展示保留紧凑留白，避免 64px 场景中的标记过小。
    -->
    <linearGradient id="outer-track" x1="138" y1="102" x2="382" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78a4ff"/>
      <stop offset="1" stop-color="#5d8ff4"/>
    </linearGradient>
    <linearGradient id="middle-track" x1="196" y1="140" x2="378" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55b5bb"/>
      <stop offset="1" stop-color="#42a4aa"/>
    </linearGradient>
    <linearGradient id="inner-track" x1="262" y1="216" x2="358" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#afc3ff"/>
      <stop offset="1" stop-color="#91abf5"/>
    </linearGradient>
    <filter id="track-depth" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#05070b" flood-opacity=".26"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#track-depth)">
    <path d="M140 110v210c0 43 27 70 70 70h164" stroke="url(#outer-track)" stroke-width="40"/>
    <path d="M205 150v150c0 31 19 50 50 50h119" stroke="url(#middle-track)" stroke-width="34"/>
    <path d="M270 230v50c0 19 11 30 30 30h50" stroke="url(#inner-track)" stroke-width="32"/>
  </g>
</svg>
