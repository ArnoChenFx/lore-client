<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!--
      完整应用图标使用浅冷灰蓝底座，在 README、系统启动器与浅色桌面中保持轻盈；
      中央柔和亮度只用于拉开三条轨道与底座的层级，不引入额外装饰图形。
    -->
    <linearGradient id="surface" x1="84" y1="58" x2="438" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8faff"/>
      <stop offset=".58" stop-color="#edf2fa"/>
      <stop offset="1" stop-color="#dfe7f3"/>
    </linearGradient>
    <radialGradient id="surface-light" cx="0" cy="0" r="1" gradientTransform="translate(260 230) rotate(90) scale(240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d7e1f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outer-track" x1="138" y1="102" x2="382" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78a4ff"/>
      <stop offset="1" stop-color="#5d8ff4"/>
    </linearGradient>
    <linearGradient id="middle-track" x1="196" y1="140" x2="378" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55b5bb"/>
      <stop offset="1" stop-color="#42a4aa"/>
    </linearGradient>
    <linearGradient id="inner-track" x1="262" y1="216" x2="358" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#afc3ff"/>
      <stop offset="1" stop-color="#91abf5"/>
    </linearGradient>
    <filter id="track-depth" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#05070b" flood-opacity=".34"/>
    </filter>
  </defs>

  <!-- 外围透明留白用于避免 Windows 与 Linux 图标在系统边界处显得拥挤。 -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#surface)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#surface-light)"/>

  <!--
    三条嵌套 L 形轨道分别表达主修订历史、受控分层与内部 Revision。不同起点、
    转角半径和终点形成清晰层级，并共同保留 Lore 的首字母轮廓。
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#track-depth)">
    <path d="M140 110v210c0 43 27 70 70 70h164" stroke="url(#outer-track)" stroke-width="40"/>
    <path d="M205 150v150c0 31 19 50 50 50h119" stroke="url(#middle-track)" stroke-width="34"/>
    <path d="M270 230v50c0 19 11 30 30 30h50" stroke="url(#inner-track)" stroke-width="32"/>
  </g>
</svg>
